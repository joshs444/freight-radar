server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the freshly published JSON comes from the worker's volume, served live
    location /data/ {
        alias /published/;
        add_header Cache-Control "no-cache";
    }

    # proxy the read-only API to the backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
