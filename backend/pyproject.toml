[project]
name = "freight-radar-backend"
version = "0.1.0"
description = "Freight Radar — PortWatch ingest + DuckDB backbone + detection + Temporal loop"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "duckdb>=1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "tenacity>=9",
    "pyyaml>=6",
    # detection brain
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    # durable orchestration + read-only API
    "temporalio>=1.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    # optional AIS vessel-position snapshot (sidecar/ais_consumer)
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]
# ambient wind layer (wind.py): GFS GRIB decode + PNG encode. eccodes>=2.43 bundles
# its binary via eccodeslib, so this pip-installs clean on CI with no apt-get.
wind = ["cfgrib>=0.9.12", "eccodes>=2.43", "xarray>=2024.0", "Pillow>=10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: hits live PortWatch ArcGIS endpoints (network required)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freight_radar"]
