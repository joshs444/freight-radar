name: Deploy globe to GitHub Pages

# Builds the static Vite frontend (which bundles the committed snapshot JSON) and
# publishes it to Pages. No backend / DuckDB needed — the site serves the
# last-published snapshot, exactly the free/static degraded path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The floor for every job; the deploy job elevates to pages/id-token below.
permissions:
  contents: read

# Queue, never cancel: cancelling an in-progress run is SILENT (no failure email),
# and refresh.yml's deploy job shares this group — killing it could leave main with
# fresh data committed but never deployed. The newest pending run still supersedes
# older pending ones, so the latest main always ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint + typecheck + format check
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
      - name: Grounding + parity gate (never deploy an ungrounded number)
        working-directory: frontend
        run: |
          npm run test:chat
          npm run test:parity
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle budget (keep heavy map chunks off the boot path)
        working-directory: frontend
        run: npm run test:bundle
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # the deploy credentials live ONLY in this artifact-only job
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
