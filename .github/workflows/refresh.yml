name: Refresh data + republish

# Keeps the live site from going stale. On a weekly cadence (matching IMF
# PortWatch's own refresh) this rebuilds the DuckDB from source, re-runs detection
# + every enricher, validates the result, commits the changed sidecars, and deploys
# to Pages — all in one run. It deploys INLINE rather than relying on the commit to
# trigger deploy.yml, because pushes made with the default GITHUB_TOKEN intentionally
# don't trigger other workflows (GitHub's loop-prevention — the push step below uses
# exactly that token, so the rule still holds). So production self-heals end to end.
#
# Split into least-privilege jobs: refresh-data holds contents:write (and nothing
# else) while the full pip+npm dependency tree executes; build-deploy holds
# pages:write + id-token:write and only builds the just-pushed commit. No job ever
# holds all three — a compromised transitive dep can't both poison main and deploy.
#
# Free: the repo is public, so Actions minutes are unlimited. Polite to the public
# PortWatch API: weekly, not hammering. Run it on demand with "Run workflow".

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC (after PortWatch's weekly update)
  workflow_dispatch:

# The floor for every job; each job elevates only what it needs.
permissions:
  contents: read

# Our OWN group — NOT "pages". When this workflow shared the deploy group, any human
# push to main mid-refresh CANCELLED the weekly run silently (a cancelled run is not
# a failed run: no email, and main could be left with fresh data committed but never
# deployed). Refresh runs queue behind each other; nothing kills them. The Pages lock
# is taken only by the build-deploy job below.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a hung GFS decode / AIS socket dies here, not at the 6h default
    permissions:
      contents: write   # push the data commit; NO pages/id-token where dependency code runs
    outputs:
      sha: ${{ steps.push.outputs.sha }}   # the exact commit build-deploy ships
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # never leave the token in .git/config for the whole pip/npm tree to read —
          # only the commit+push step at the bottom holds a credential, for one command
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend (uv, hash-pinned from uv.lock)
        working-directory: backend
        run: |
          uv sync --extra wind
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Rebuild DuckDB from PortWatch + publish all sidecars
        working-directory: backend
        run: |
          python -m freight_radar.backfill
          python -m freight_radar.wind || echo "wind layer skipped (GFS unavailable)"
          python -m freight_radar.publish
          python -m freight_radar.history || echo "history skipped (PortWatch unavailable)"

      - name: Regenerate the DERIVED briefing (offline reasoner, gate fail-closed)
        working-directory: backend
        # the reasoner reads the freshly-published store, grounds every claim, and is GATE-
        # validated (attribution + abstention + language firewall) before ai_briefing.json is
        # written — a hallucinated/ungrounded number never ships. A gate trip takes THIS layer
        # dark (stale briefing removed + a demotions.json receipt) and exits 0: the briefing
        # is optional DERIVED garnish, and one bad layer never aborts the weekly publish. Run
        # as a subprocess (not a Python import) so the AI firewall — nothing imports
        # derived/ — holds.
        run: python -m freight_radar.derived.reason ../frontend/public/data

      - name: Mine the hyp_* association tier (DARK — console-only, never the globe)
        working-directory: backend
        # BH-controlled lead-lag co-movements across the signal z-series in the substrate
        # Parquet, emitted to data/hyp/. A subprocess (nothing imports hyp), and the rendering
        # fence keeps it off the globe — it's measured association, never a forecast or a cause.
        run: python -m freight_radar.hyp.associate ../frontend/public/data || echo "hyp skipped (no substrate yet)"

      - name: Snapshot real AIS vessel positions near the chokepoints
        working-directory: backend
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        # ~70s one-shot sample written to ships.json; degrades to demo/offline on any
        # failure (garnish — never blocks the refresh). Needs the AISSTREAM_API_KEY secret.
        run: python -m freight_radar.sidecar.ais_consumer --snapshot || echo "AIS snapshot skipped"
        continue-on-error: true

      - name: Graceful-rot self-demotion (the metabolism — runs untended)
        working-directory: backend
        # A freshly-fetched feed that failed its data contract is QUARANTINED to dark
        # (deleted) here, BEFORE commit, so a rotted source disappears instead of shipping
        # broken — the refresh survives with zero human intervention. A broken measured SPINE
        # hard-fails this step (exit 1), so an absent spine never silently ships as a broken one.
        run: python -m freight_radar.contracts --demote ../frontend/public/data

      - name: Provenance-parity deploy-gate (stamped source_url == registry root)
        working-directory: backend
        # P2-B: fail the refresh BEFORE it commits/ships if any freshly-published flag/signal
        # source_url or license has drifted from the registry SSOT, or if the fenced national band
        # is place-conditioned (fence #1). Stamping freezes URLs at build time; this is the gate
        # that guarantees stale stamped data can never ship. Same checks as the pytest gate
        # (tests/test_provenance_parity.py), here on the freshly-published deploy artifact.
        run: python -m freight_radar.registry.parity ../frontend/public/data

      - name: Append the run + flag ledgers (F1 — the system remembers its own outputs)
        working-directory: backend
        # One slim JSONL line per flag and one per run under data/state/ — the durable memory
        # that flag lifecycle and the backtest read (ADR-0009). Runs AFTER the gates (only a
        # publish that passed them is remembered) and never inside publish itself, so the
        # golden harness stays deterministic. Idempotent, exit 0 — a failure here is a real
        # failure: a refresh that can't remember itself must not ship.
        run: python -m freight_radar.ledger ../frontend/public/data

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend validation against the fresh data (BEFORE anything is committed)
        working-directory: frontend
        # grounding + parity + build + bundle budget run on the refreshed sidecars BEFORE the
        # data commit. These used to run after the push — bad fresh data landed on main first,
        # then every deploy from main failed until the next refresh. Now the data commit and
        # the Pages deploy succeed or fail together.
        run: |
          npm ci
          npm run test:chat
          npm run test:parity
          npm run build
          npm run test:bundle

      - name: Commit + push refreshed sidecars
        id: push
        env:
          # the ONLY step with a write credential, and only for these commands —
          # checkout above persisted nothing into .git/config
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "freight-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/data  # -A so a demoted (deleted) feed goes dark in git too
          git add -f frontend/public/data/wind_f*.png 2>/dev/null || true
          git add -f data/state/events_state.json 2>/dev/null || true
          git add -f data/state/flags_ledger.jsonl data/state/run_ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Auto-refresh data sidecars ($(date -u +%Y-%m-%d))"
            # same branch the run checked out (main on schedule), same loop-prevention:
            # a push made with the default GITHUB_TOKEN never triggers ci.yml/deploy.yml
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "Pushed refreshed data."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: refresh-data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write     # the deploy credentials live ONLY in this npm-build-only job
      id-token: write
    # serialize against deploy.yml here (and only here): the long-running data job
    # above never holds the Pages lock
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # the EXACT commit refresh-data pushed — not a racy `main` that may have
          # moved under us between the push and this checkout
          ref: ${{ needs.refresh-data.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend with the fresh data
        working-directory: frontend
        # already validated in refresh-data on this same content; this is just the build
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  drift-monitor:
    needs: [refresh-data, build-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The scheduled contract-check from the plan. Its own job, run LAST, so a feed whose
    # schema changed or went empty fails THIS run (pinging the maintainer) WITHOUT halting
    # the refresh+deploy above — the one drifted layer degrades to absent; the spine still
    # ships. Validates the freshly-committed sidecars against freight_radar/contracts.py.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.refresh-data.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Upstream contract drift check (monitor)
        working-directory: backend
        run: |
          uv sync
          uv run python -m freight_radar.contracts ../frontend/public/data
