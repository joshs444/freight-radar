name: Refresh data + republish

# Keeps the live site from going stale. On a weekly cadence (matching IMF
# PortWatch's own refresh) this rebuilds the DuckDB from source, re-runs detection
# + every enricher, and commits the changed sidecars. That push triggers the Pages
# deploy, so production self-heals without anyone running anything by hand.
#
# Free: the repo is public, so Actions minutes are unlimited. Polite to the public
# PortWatch API: weekly, not hammering. Run it on demand with "Run workflow".

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC (after PortWatch's weekly update)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild DuckDB from PortWatch + publish all sidecars
        working-directory: backend
        run: |
          python -m freight_radar.backfill
          python -m freight_radar.publish

      - name: Commit refreshed sidecars
        run: |
          git config user.name "freight-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/*.json
          git add -f backend/data/state/events_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Auto-refresh data sidecars ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed data — Pages deploy will follow."
          fi
