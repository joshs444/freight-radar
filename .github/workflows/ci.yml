name: CI — tests + grounding evals

# The credibility gate. Runs on every push + PR so the backend test suite and the
# grounding/parity evals — the artifacts that make the honesty claims TRUE — are
# enforced, not decorative. A change that ungrounds a number, breaks a fail-loud ETL
# guard, or drifts the JS exposure math from the Python pipeline now fails here instead
# of deploying clean. deploy.yml gates the frontend lint/typecheck/build; this covers
# what it doesn't. Free: the repo is public, so Actions minutes are unlimited.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend pytest (non-live)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend + test deps (hash-pinned from uv.lock)
        working-directory: backend
        # `dev` carries pytest/pytest-asyncio; `wind` lets the GFS-decode tests import.
        run: uv sync --extra wind --extra dev
      - name: Run the deterministic (non-live) test suite
        working-directory: backend
        run: uv run pytest -q -m "not live"

  dbt-build:
    name: dbt build (duckdb, hermetic fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The dbt layer (../dbt) re-expresses the DuckDB transforms as models and the ETL
    # guards as tests. The 32 MB prod warehouse is gitignored, so we rebuild a tiny
    # fixture DB from committed CSVs (dbt/ci/fixtures) with the EXACT prod DDL, then
    # `dbt build` it — models materialize + every dbt test passes, or CI fails.
    env:
      # Both the fixture loader and the dbt `ci` target read this one path.
      FREIGHT_RADAR_DB: ${{ github.workspace }}/dbt/freight_radar_ci.duckdb
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend + dbt deps (hash-pinned from uv.lock)
        working-directory: backend
        run: uv sync --extra dbt
      - name: Build the hermetic CI warehouse from committed fixtures
        working-directory: backend
        run: uv run python ../dbt/ci/build_fixture_db.py
      - name: dbt deps (vendor dbt_utils)
        working-directory: backend
        run: uv run dbt deps --project-dir ../dbt --profiles-dir ../dbt
      - name: dbt build — models materialize + ETL-guard tests pass
        working-directory: backend
        run: uv run dbt build --project-dir ../dbt --profiles-dir ../dbt --target ci
      - name: Python↔dbt parity — the stress index agrees in both implementations
        working-directory: backend
        # The strongest numeric-correctness gate: narrative/stress.py compute() and the
        # dbt mart_freight_stress_index, computed independently from the same fixture,
        # must agree to the published decimal across every day, or CI fails.
        run: uv run python ../dbt/ci/check_parity.py

  frontend-checks:
    name: grounding + parity + bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Chat grounding eval — every cited fact must trace to its source sidecar
        working-directory: frontend
        run: npm run test:chat
      - name: Exposure parity eval — JS matches the Python pipeline on the sample CSV
        working-directory: frontend
        run: npm run test:parity
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle budget — heavy map chunks must stay off the boot critical path
        working-directory: frontend
        run: npm run test:bundle

  lighthouse:
    name: lighthouse (perf + a11y report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the static site
        working-directory: frontend
        run: npm ci && npm run build
      - name: Lighthouse CI (a11y gated; perf/best-practices reported)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
